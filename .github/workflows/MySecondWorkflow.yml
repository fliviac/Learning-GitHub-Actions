on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir ./reports
          pytest --junitxml=./reports/unit-tests-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name: Upload Code Coverage Test Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-tests-results
          path: ./reports/
  code-ql:
    name: Code QL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      matrix:
        language: ['python']
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: 'security'
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      # This step should build, test and generate coverage reports
      # - name: Build and test
      #   run: <build + test + generate coverage reports>
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=fliviac
            -Dsonar.projectKey=fliviac_Learning-GitHub-Actions
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v1.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}      