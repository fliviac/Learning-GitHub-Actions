on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  ENV_TYPE: DEV
  APP_USER: thinknyx
  APP_PORT: 80
  
jobs:
  job1:
    name: JOB1
    runs-on: ubuntu-latest
    steps:
      - name: Step-1
        run: |
          pwd
          ls -ltr
          hostname
      - name: Step-2 Checkout
        uses: actions/checkout@v6.1.0
      - name: Step-3
        run: |
          echo `pwd` >> myartifact.txt
          mkdir artifacts
          echo `ls -ltr` >> artifacts/list.txt
          echo `hostname` >> artifacts/hostname.txt
      - name: Upload a Single File
        uses: actions/upload-artifact@v7
        with:
           name: single_file
           path: ./myartifact.txt
  job2:
    name: JOB2
    runs-on: ubuntu-latest
    needs: job1
    steps:
      - name: Checking current directory
        run: |
          pwd
          ls -ltr
      - name: Download single file
        uses: actions/download-artifact@v8
        with:
          name: single_file
      - name: Checking current directory post download
        run: |
          pwd
          ls -ltr
      - name: Step for PR Demos
        run: exit 0
      - name: Referring environment variables
        run: |
          echo "[INFO] Running Deployment for $ENV_TYPE with user $APP_USER."
          echo "[INFO] Once deployment application is accesible on port $APP_PORT."
      - name: Referring Repository Secret
        run: |
          echo "[INFO] Application password is ${{ secrets.APP_PASSWORD }}."
  job3:
    name: JOB3
    runs-on: ubuntu-latest
    steps:
      - name: Referring Context or in-built variables
        run: |
          echo "[INFO] Triggered by ${{ github.event_name }}."
          echo "[INFO] New changes are added by ${{ github.actor }} in ${{ github.ref_name }} branch."
          echo "[INFO] Current step is running on ${{ runner.os }}."
          echo "[INFO] Current JOB Id is ${{ job.check_run_id }}."
  staging:
    name: STAGE DEPLOYMENT
    runs-on: ubuntu-latest
    steps:
      - name: Referring environment variables
        run: echo "[INFO] Running deployment on ${{ vars.HOSTNAME }} using ${{ vars.USER }}."
      - name: Referring environment secrets
        run: echo "[INFO] Password for user ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
    environment:
      name: STAGING
    if: github.head_ref == 'dev'
  production:
      name: PROD DEPLOYMENT
      runs-on: ubuntu-latest
      steps:
        - name: Referring environment variables
          run: echo "[INFO] Running deployment on ${{ vars.HOSTNAME }} using ${{ vars.USER }}."
        - name: Referring environment secrets
          run: echo "[INFO] Password for user ${{ vars.USER }} is ${{ secrets.PASSWORD }}."
      environment:
        name: PRODUCTION
      if: github.ref == 'refs/heads/main'
