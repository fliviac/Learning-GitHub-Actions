on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.1.0
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir ./reports
          pytest --junitxml=./reports/unit-tests-results.xml --cov=. --cov-report=xml --cov-report=term-missing -v
      - name: Upload Code Coverage Test Results
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-tests-results
          path: ./reports/
